<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dropzone</title>
<style>
  :root{
    --canvas:#dfe7e4;
    --paper:rgba(255,255,255,.5); --paper-2:rgba(255,255,255,.34); --paper-solid:#FCFBF8;
    --ink:#12273a; --ink-soft:#52647a; --line:rgba(255,255,255,.62); --line-soft:rgba(110,135,150,.2);
    --signal:#0C8A7C; --signal-deep:#0B7D72; --pop:#E8633A;
    --glass:saturate(165%) blur(22px);
    --shadow:0 22px 54px -30px rgba(16,38,58,.55);
  }
  html[data-theme="dark"]{
    --canvas:#080e16;
    --paper:rgba(38,54,72,.46); --paper-2:rgba(70,92,114,.3); --paper-solid:#1b2836;
    --ink:#EAF1F5; --ink-soft:#9eb0bf; --line:rgba(255,255,255,.14); --line-soft:rgba(255,255,255,.09);
    --signal:#2ad6c3; --signal-deep:#19BCAB; --pop:#F0744A;
    --shadow:0 26px 64px -28px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--canvas);color:var(--ink);min-height:100dvh;position:relative;overflow-x:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:-18%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(36vw 36vw at 16% 20%, color-mix(in srgb,var(--signal) 62%,transparent), transparent 60%),
      radial-gradient(32vw 32vw at 84% 14%, color-mix(in srgb,var(--pop) 55%,transparent), transparent 60%),
      radial-gradient(42vw 42vw at 76% 86%, color-mix(in srgb,var(--signal) 48%,transparent), transparent 62%),
      radial-gradient(30vw 30vw at 10% 88%, color-mix(in srgb,var(--pop) 42%,transparent), transparent 60%);
    filter:blur(32px) saturate(125%);animation:dzDrift 26s ease-in-out infinite alternate}
  button,input,textarea{font-family:inherit}
  ::selection{background:color-mix(in srgb,var(--signal) 30%,transparent)}
  .dz-scroll::-webkit-scrollbar{width:8px}
  .dz-scroll::-webkit-scrollbar-thumb{background:var(--line-soft);border-radius:8px}
  @keyframes dzDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-4%,3%) scale(1.1)}}
  @keyframes dzRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes dzSlide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  @keyframes dzSonar{0%{transform:scale(.5);opacity:.5}100%{transform:scale(1.85);opacity:0}}
  @keyframes dzGlow{0%{opacity:.95}100%{opacity:0}}
  @keyframes dzLive{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes dzPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  @media(max-width:980px){#dz-grid{grid-template-columns:1fr!important}#dz-rail{position:static!important}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}

  html[data-slim="1"] body::before{animation:none;opacity:.28}
</style>
</head>
<body>
<div id="dz-root"></div>
<template id="dz-tpl">
<div style="max-width:1240px;margin:0 auto;padding:0 20px 80px">

  <header style="display:flex;align-items:center;gap:14px;padding:22px 2px 18px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:9px">
      <span style="width:13px;height:13px;border-radius:50%;background:var(--pop);box-shadow:0 0 14px 1px color-mix(in srgb,var(--pop) 70%,transparent),0 0 0 4px color-mix(in srgb,var(--pop) 22%,transparent)"></span>
      <b style="font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:15px">Dropzone</b>
    </div>
    <span style="color:var(--ink-soft);font-size:12.5px;letter-spacing:.02em">{{ netTag }}</span>
    <span style="flex:1 1 auto"></span>
    <span style="display:inline-flex;align-items:center;gap:8px;background:var(--paper);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:13px;box-shadow:var(--shadow)">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 8px 1px color-mix(in srgb,var(--signal) 70%,transparent);animation:dzLive 1.8s ease-in-out infinite"></span>
      <b style="color:var(--signal)">{{ deviceCount }}</b> devices
    </span>
    <button onclick="{{ openQR }}" style="display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);color:var(--ink);font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer;line-height:1;box-shadow:var(--shadow)" style-hover="border-color:var(--signal);color:var(--signal)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3M21 14v7M17 21h4"></path></svg>
      <span>Add device</span>
    </button>
    <button onclick="{{ toggleTheme }}" title="Toggle theme" style="display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--paper);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);color:var(--ink);padding:8px 11px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow)" style-hover="border-color:var(--signal);color:var(--signal)">
      {{ themeIcon }}
    </button>
    <button onclick="{{ doLogout }}" title="Lock" style="border:1px solid var(--line);background:var(--paper);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);color:var(--ink);font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;line-height:1;box-shadow:var(--shadow)" style-hover="border-color:var(--signal);color:var(--signal)">Lock</button>
  </header>

  <div id="dz-grid" style="display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:28px;align-items:start">

    <main style="min-width:0">
      <div onclick="{{ onSlotClick }}" ondragover="{{ onDragOver }}" ondragleave="{{ onDragLeave }}" ondrop="{{ onDrop }}" tabindex="0" role="button" style="position:relative;background:var(--paper);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:2px dashed var(--line);border-radius:24px;padding:42px 24px;text-align:center;cursor:pointer;transition:border-color .18s,box-shadow .18s;overflow:hidden;box-shadow:var(--shadow)">
        <sc-if value="{{ isDragging }}">
          <div style="position:absolute;inset:6px;border:2px solid var(--signal);border-radius:18px;background:color-mix(in srgb,var(--signal) 12%,transparent);pointer-events:none"></div>
        </sc-if>
        <div style="position:relative">
          <div style="width:50px;height:50px;margin:0 auto 14px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--signal) 18%,transparent);color:var(--signal);box-shadow:0 8px 22px -10px color-mix(in srgb,var(--signal) 80%,transparent)">
            <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M12 4l-5 5M12 4l5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
          </div>
          <h2 style="margin:0 0 4px;font-size:19px;letter-spacing:-.01em">Drop files or folders to share</h2>
          <p style="color:var(--ink-soft);font-size:13.5px;margin:0">Drag them in, <span style="color:var(--signal);font-weight:600;text-decoration:underline;text-underline-offset:3px">browse</span>, or paste a screenshot · up to 2048 MB each</p>
        </div>
        <input type="file" ref="{{ setFileInput }}" onchange="{{ onFileChange }}" multiple="" hidden="hidden">
      </div>

      <div style="margin-top:14px;background:var(--paper);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)">
        <div style="display:flex;gap:10px;align-items:flex-end">
          <textarea oninput="{{ onNoteInput }}" data-keep="note" value="{{ noteDraft }}" rows="1" placeholder="Paste text or a link to share across devices…" style="flex:1;border:0;background:transparent;color:var(--ink);resize:none;font-size:15px;line-height:1.5;min-height:24px;max-height:160px;padding:6px 4px;outline:none"></textarea>
          <button onclick="{{ toggleRecord }}" title="Record a voice memo" style="{{ micStyle }}">{{ micIcon }}</button>
          <button onclick="{{ shareNote }}" disabled="{{ noteDisabled }}" style="border:0;background:var(--ink);color:var(--canvas);font-weight:600;font-size:14px;padding:11px 17px;border-radius:12px;cursor:pointer;white-space:nowrap" style-hover="background:var(--signal)">Share text</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
          <button onclick="{{ toggleBurn }}" style="{{ burnChip }}">{{ burnIcon }} Burn after read</button>
          <button onclick="{{ toggleExpire }}" style="{{ expireChip }}">{{ clockLabel }}</button>
          <sc-if value="{{ showFetchUrl }}">
            <button onclick="{{ fetchUrl }}" style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--signal);background:color-mix(in srgb,var(--signal) 14%,transparent);color:var(--signal);font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer">{{ globeIcon }} Fetch this URL to the server</button>
          </sc-if>
          <span style="flex:1 1 auto"></span>
          <span style="display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft)">Share with
            <select ref="{{ initTargetSelect }}" style="border:1px solid var(--line);background:var(--paper-2);color:var(--ink);font-size:12.5px;padding:5px 9px;border-radius:999px;outline:none;cursor:pointer"></select>
          </span>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;margin:26px 2px 14px;flex-wrap:wrap">
        <span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)">shared · <b style="color:var(--signal)">{{ count }}</b> items</span>
        <span style="flex:1 1 auto"></span>
        <div style="display:flex;gap:4px;background:var(--paper-2);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);padding:4px;border-radius:999px">
          <button onclick="{{ filterAll }}" style="{{ pillAll }}">All</button>
          <button onclick="{{ filterFile }}" style="{{ pillFile }}">Files</button>
          <button onclick="{{ filterImage }}" style="{{ pillImage }}">Photos</button>
          <button onclick="{{ filterNote }}" style="{{ pillNote }}">Text</button>
        </div>
        <button onclick="{{ toggleSelecting }}" style="border:1px solid var(--line);background:var(--paper);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);color:var(--ink);font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer" style-hover="border-color:var(--signal);color:var(--signal)">{{ selectLabel }}</button>
        <div style="flex:1;min-width:140px;display:flex;align-items:center;gap:8px;background:var(--paper);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px" style-focus-within="border-color:var(--signal)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--ink-soft)" stroke-width="2" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input oninput="{{ onSearch }}" data-keep="search" value="{{ query }}" placeholder="Search" style="border:0;background:transparent;color:var(--ink);font-size:14px;width:100%;outline:none">
        </div>
      </div>

      <sc-if value="{{ hasLabels }}">
        <div style="display:flex;align-items:center;gap:7px;margin:0 2px 14px;flex-wrap:wrap">
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)">labels</span>
          <sc-for list="{{ labels }}" as="l">
            <button onclick="{{ l.clickHandler }}" style="{{ l.style }}">{{ l.name }} · {{ l.count }}</button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ selecting }}">
        <div style="display:flex;align-items:center;gap:10px;margin:0 2px 14px;padding:10px 14px;background:color-mix(in srgb,var(--signal) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--signal) 40%,transparent);border-radius:14px;animation:dzRise .2s ease both">
          <b style="font-size:13px;color:var(--signal)">{{ selCountText }}</b>
          <span style="flex:1 1 auto"></span>
          <button onclick="{{ bulkLabel }}" style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer" style-hover="border-color:var(--signal);color:var(--signal)">Label…</button>
          <button onclick="{{ bulkZip }}" style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer" style-hover="border-color:var(--signal);color:var(--signal)">Download as zip</button>
          <button onclick="{{ bulkDelete }}" disabled="{{ anySelected }}" style="display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--pop) 50%,transparent);background:color-mix(in srgb,var(--pop) 12%,transparent);color:var(--pop);font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer">Delete selected</button>
        </div>
      </sc-if>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px">
        <sc-for list="{{ feedItems }}" as="it">
          <div onclick="{{ it.openHandler }}" style="position:relative;background:var(--paper);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:dzRise .26s ease both;cursor:pointer">

            <sc-if value="{{ it.selecting }}">
              <button onclick="{{ it.selectHandler }}" title="Select" style="position:absolute;top:8px;left:8px;z-index:3;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--signal);background:{{ it.checkBg }};color:#fff;cursor:pointer;display:grid;place-items:center">
                <sc-if value="{{ it.checked }}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"></path></svg></sc-if>
              </button>
            </sc-if>

            <button onclick="{{ it.pinHandler }}" title="Pin" style="position:absolute;top:8px;right:8px;z-index:3;width:26px;height:26px;border-radius:9px;border:0;background:color-mix(in srgb,var(--paper-solid) 78%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:{{ it.pinColor }};cursor:pointer;display:grid;place-items:center" style-hover="color:var(--pop)">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 17v5"></path><path d="M8 3h8l-1 7 3 3H6l3-3z"></path></svg>
            </button>

            <sc-if value="{{ it.forYou }}">
              <span style="position:absolute;top:8px;left:8px;z-index:2;font-size:9.5px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--pop);padding:3px 8px;border-radius:999px;box-shadow:0 4px 12px -4px var(--pop)">for you</span>
            </sc-if>

            <sc-if value="{{ it.isBurn }}">
              <div style="padding:22px 14px 14px;flex:1;text-align:center">
                <div style="width:40px;height:40px;margin:0 auto 10px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pop) 16%,transparent);color:var(--pop)">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2c1 4-4 5-4 10a4 4 0 0 0 8 0c0-2-1-3-1-3s3 1 3 4a6 6 0 0 1-12 0C6 7 11 6 12 2z"></path></svg>
                </div>
                <div style="font-size:13.5px;font-weight:600">Secret note</div>
                <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px">Deletes itself after reading</div>
                <button onclick="{{ it.revealHandler }}" style="margin-top:12px;border:1px solid color-mix(in srgb,var(--pop) 50%,transparent);background:color-mix(in srgb,var(--pop) 12%,transparent);color:var(--pop);font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer">Reveal once</button>
              </div>
              <div style="padding:10px 14px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft)">
                <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--pop);padding:2px 7px;border:1px solid color-mix(in srgb,var(--pop) 40%,transparent);border-radius:999px">burn</span>
                <span style="flex:1"></span>
                <span style="font-size:11.5px;color:var(--ink-soft)">{{ it.whenText }}</span>
                <button onclick="{{ it.delHandler }}" title="Delete" style="border:0;background:transparent;color:var(--ink-soft);cursor:pointer;padding:5px;border-radius:8px;display:inline-flex" style-hover="color:var(--pop);background:var(--paper-2)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg></button>
              </div>
            </sc-if>

            <sc-if value="{{ it.isNote }}">
              <div style="padding:26px 14px 6px;flex:1">
                <p style="margin:0;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden">{{ it.content }}</p>
              </div>
              <div style="padding:10px 14px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft)">
                <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:2px 7px;border:1px solid var(--line-soft);border-radius:999px">text</span>
                <sc-if value="{{ it.hasLabel }}"><span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.06em;color:var(--signal);padding:2px 7px;border:1px solid color-mix(in srgb,var(--signal) 40%,transparent);border-radius:999px">{{ it.label }}</span></sc-if>
                <span style="flex:1"></span>
                <span style="font-size:11.5px;color:var(--ink-soft)">{{ it.whenText }}</span>
                <button onclick="{{ it.copyHandler }}" title="Copy" style="border:0;background:transparent;color:var(--ink-soft);cursor:pointer;padding:5px;border-radius:8px;display:inline-flex" style-hover="color:var(--signal);background:var(--paper-2)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>
                <button onclick="{{ it.delHandler }}" title="Delete" style="border:0;background:transparent;color:var(--ink-soft);cursor:pointer;padding:5px;border-radius:8px;display:inline-flex" style-hover="color:var(--pop);background:var(--paper-2)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg></button>
              </div>
            </sc-if>

            <sc-if value="{{ it.isFile }}">
              <div style="aspect-ratio:16/11;background:var(--paper-2);display:grid;place-items:center;overflow:hidden">
                <sc-if value="{{ it.isImage }}">{{ it.thumbEl }}</sc-if>
                <sc-if value="{{ it.isFile2 }}">
                  <span style="font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--signal);background:color-mix(in srgb,var(--signal) 16%,transparent);padding:7px 11px;border-radius:9px">{{ it.glyph }}</span>
                </sc-if>
              </div>
              <div style="padding:10px 14px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line-soft)">
                <span style="flex:1;min-width:0">
                  <span style="display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="{{ it.name }}">{{ it.name }}</span>
                  <span style="font-size:11.5px;color:var(--ink-soft)">{{ it.sizeText }} · {{ it.whenText }}<sc-if value="{{ it.hasLabel }}"> · <span style="color:var(--signal)">{{ it.label }}</span></sc-if></span>
                </span>
                <sc-if value="{{ it.hasShare }}">
                  <button onclick="{{ it.shareHandler }}" title="Copy share link" style="border:0;background:transparent;color:var(--ink-soft);cursor:pointer;padding:5px;border-radius:8px;display:inline-flex" style-hover="color:var(--signal);background:var(--paper-2)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg></button>
                </sc-if>
                <a href="{{ it.downHref }}" onclick="{{ it.stop }}" title="Download" style="border:0;background:transparent;color:var(--ink-soft);cursor:pointer;padding:5px;border-radius:8px;display:inline-flex" style-hover="color:var(--signal);background:var(--paper-2)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"></path></svg></a>
                <button onclick="{{ it.delHandler }}" title="Delete" style="border:0;background:transparent;color:var(--ink-soft);cursor:pointer;padding:5px;border-radius:8px;display:inline-flex" style-hover="color:var(--pop);background:var(--paper-2)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg></button>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ showEmpty }}">
        <div style="text-align:center;padding:56px 20px;color:var(--ink-soft)">
          <div style="font-size:40px;margin-bottom:8px;opacity:.5">◇</div>
          <div>Nothing shared yet. Drop a file or paste some text to start.</div>
        </div>
      </sc-if>

  function collectEntries(entries){
    const out=[];

      return new Promise(res=>{

      tabDev:tabStyle(s.tab==="devices"), tabAct:tabStyle(s.tab==="activity"), tabChatStyle:tabStyle(s.tab==="chat"),
      tabDevices:()=>setTab("devices"), tabActivity:()=>setTab("activity"), tabChat:()=>setTab("chat"),
      isDevices:s.tab==="devices", isActivity:s.tab==="activity", isChat:s.tab==="chat",
      setFileInput, setChatScroll, onSlotClick, onFileChange, onDragOver, onDragLeave, onDrop,
      noteDraft:s.noteDraft, onNoteInput, shareNote, noteDisabled:!s.noteDraft.trim(),
      burnChip:chipStyle(s.noteBurn), expireChip:chipStyle(s.noteExpire), toggleBurn, toggleExpire,
      burnIcon:{__html:svg("flame",13)}, clockLabel:"Expires in 24h",
      showFetchUrl:looksLikeUrl(s.noteDraft), fetchUrl, globeIcon:{__html:svg("globe",13)},
      recording:s.recording, toggleRecord,
      micIcon:{__html: s.recording?svg("stop",16):svg("mic",16)},
      micStyle:"border:1px solid "+(s.recording?"var(--pop)":"var(--line)")+";background:"+(s.recording?"color-mix(in srgb,var(--pop) 16%,transparent)":"transparent")+";color:"+(s.recording?"var(--pop)":"var(--ink-soft)")+";width:42px;height:42px;border-radius:12px;cursor:pointer;display:grid;place-items:center;flex:none",
      targetOptions, setTarget, initTargetSelect, hasTarget:!!s.target,
      labels, hasLabels:labels.length>0, bulkLabel,
      tabScr:tabStyle(s.tab==="screen"), tabScreen:()=>setTab("screen"), isScreen:s.tab==="screen",
      scrChecked:!!s.screen, scrReady:!!(scr.vnc && scr.bridge), scrVnc:!!scr.vnc, scrNoVnc:s.screen? !scr.vnc : false,
      scrBridgeDown:!!(scr.vnc && !scr.bridge), refreshScreen,
      scrDot: (scr.vnc&&scr.bridge)?"var(--signal)":"var(--pop)",
      scrText: !s.screen ? "checking…" : (scr.vnc&&scr.bridge) ? "Ready — the laptop's screen is live" : (scr.vnc ? "Bridge offline — pip install websockify, then restart Dropzone" : "Not running yet — one-time setup below"),
      storageOpen:s.storageOpen, openStorage, closeStorage, onStorageBackdrop, largest, hasLargest:largest.length>0,
      cleanOld:()=>cleanup("older30"), cleanUnpinned:()=>cleanup("unpinned"),
      usedText:fmtSize(st.used||0), freeText:fmtSize(st.free||0),
      digFiles:()=>{ setFilter("file"); }, digNotes:()=>{ setFilter("note"); }, digChat:()=>setTab("chat"),
      selecting:s.selecting, notSelecting:!s.selecting, toggleSelecting,
      selectLabel: s.selecting?"Done":"Select",
      selCountText: selCount()+" selected", anySelected:selCount()>0,
      bulkDelete, bulkZip,
      query:s.query, onSearch,
      chatDraft:s.chatDraft, onChatInput, onChatKey, sendChat, chatDisabled:!s.chatDraft.trim(),
      toggleTheme, openQR, closeQR, onQrBackdrop, doLogout,
      qrOpen:s.qrOpen, qrEl:{__html:'<img src="/qr.svg?'+qrNonce+'" width="200" height="200" alt="QR code" style="display:block;width:200px;height:200px">'},
      toastMsg:s.toastMsg,
      upActive:up.active, upProgress:Math.round(up.progress), upDone:up.progress>=100, upGoing:up.progress<100,
      upTitle:up.title, upSub:up.sub, upDevices, arcDash:C, arcOffset:C*(1-up.progress/100),
      hostAddr:location.host, hostUrl:location.origin,
      storageText, storagePct,
      pvOpen:!!s.preview, closePreview, onPreviewBackdrop,
      pvName:pv.name||"", pvIsImage:pvKind==="image", pvIsVideo:pvKind==="video", pvIsAudio:pvKind==="audio",
      pvIsPdf:pvKind==="pdf", pvIsText:pvKind==="text"||pvKind==="burn",
      pvSrc: pv.raw_url||"", pvText:s.previewText,
      pvDownHref: pv.download_url||"", pvHasDown: !!pv.download_url,
    };
  }

  // ---------------------------------------------------------------- mini interpreter
  function stripBind(v){ const m=/{{\s*([\s\S]+?)\s*}}/.exec(v||""); return m?m[1].trim():(v||"").trim(); }
  function resolve(expr, scope){
    expr=(expr||"").trim();
    if(expr==="true") return true; if(expr==="false") return false; if(expr==="null") return null;
    const parts=expr.split("."); let v=scope;
    for(const p of parts){ if(v==null) return undefined; v=v[p.trim()]; }
    return v;
  }
  function interp(str, scope){ return str.replace(/{{\s*([\s\S]+?)\s*}}/g,(_,e)=>{ const v=resolve(e,scope); return v==null?"":String(v); }); }
  function parseHTML(html){ const t=document.createElement("template"); t.innerHTML=html; return t.content; }

  function expand(parent, scope){ const kids=[].slice.call(parent.childNodes); for(const c of kids) handle(c, parent, scope); }
  function handle(node, parent, scope){
    if(node.nodeType===3){ textBind(node, scope); return; }
    if(node.nodeType!==1) return;
    const tag=node.tagName.toLowerCase();
    if(tag==="sc-for"){ expandFor(node, parent, scope); return; }
    if(tag==="sc-if"){ expandIf(node, parent, scope); return; }
    bindAttrs(node, scope);
    expand(node, scope);
  }
  function expandFor(node, parent, scope){
    const arr=resolve(stripBind(node.getAttribute("list")), scope)||[];
    const as=node.getAttribute("as")||"it";
    const tmpl=[].slice.call(node.childNodes);
    for(const item of arr){
      const cs=Object.assign({}, scope); cs[as]=item;
      for(const tn of tmpl){ const c=tn.cloneNode(true); parent.insertBefore(c,node); handle(c,parent,cs); }
    }
    parent.removeChild(node);
  }
  function expandIf(node, parent, scope){
    const cond=resolve(stripBind(node.getAttribute("value")), scope);
    if(cond){ const t=[].slice.call(node.childNodes); for(const tn of t){ parent.insertBefore(tn,node); handle(tn,parent,scope); } }
    parent.removeChild(node);
  }
  function textBind(node, scope){
    const s=node.nodeValue; if(!s || s.indexOf("{{")<0) return;
    const whole=/^\s*{{\s*([^{}]+?)\s*}}\s*$/.exec(s);
    if(whole){
      const v=resolve(whole[1], scope);
      if(v && typeof v==="object" && "__html" in v){ node.parentNode.insertBefore(parseHTML(v.__html), node); node.parentNode.removeChild(node); return; }
      node.nodeValue = v==null?"":String(v); return;
    }
    node.nodeValue = interp(s, scope);
  }
  function bindAttrs(el, scope){
    const attrs=[].slice.call(el.attributes);
    for(const {name, value} of attrs){
      const ln=name.toLowerCase();
      if(ln.indexOf("on")===0 && ln.length>2 && value.indexOf("{{")>=0){
        const fn=resolve(stripBind(value), scope); el.removeAttribute(name);
        if(typeof fn==="function") el.addEventListener(ln.slice(2), fn);
      } else if(ln==="ref"){
        const fn=resolve(stripBind(value), scope); el.removeAttribute(name);
        if(typeof fn==="function") fn(el);
      } else if(ln==="style-hover" || ln==="style-focus" || ln==="style-focus-within"){
        const extra=interp(value, scope); el.removeAttribute(name);
        if(!el.hasAttribute("data-base-style")) el.setAttribute("data-base-style", el.getAttribute("style")||"");
        const evs = ln==="style-hover" ? ["mouseenter","mouseleave"] : ["focusin","focusout"];
        el.addEventListener(evs[0], ()=>el.setAttribute("style",(el.getAttribute("data-base-style")||"")+";"+extra));
        el.addEventListener(evs[1], ()=>el.setAttribute("style",(el.getAttribute("data-base-style")||"")));
      } else if(value.indexOf("{{")>=0){
        const whole=/^{{\s*([^{}]+?)\s*}}$/.exec(value.trim());
        if(whole){
          const v=resolve(whole[1], scope);
          if(ln==="value" && (el.tagName==="INPUT"||el.tagName==="TEXTAREA")){ el.value=v==null?"":String(v); el.removeAttribute(name); }
          else if(ln==="disabled"||ln==="hidden"||ln==="checked"||ln==="selected"){ if(v){ el.setAttribute(ln,""); } else { el.removeAttribute(ln); } if(ln==="disabled") el.disabled=!!v; if(ln==="selected") el.selected=!!v; }
          else { el.setAttribute(name, v==null?"":String(v)); }
        } else {
          el.setAttribute(name, interp(value, scope));
        }
      }
    }
  }

  // ---------------------------------------------------------------- render + focus preservation
  function doRender(){
    const V=computeV();
    const frag=tpl.content.cloneNode(true);
    expand(frag, V);

    const a=document.activeElement; let keep=null, ss=null, se=null;
    if(a && root.contains(a) && a.getAttribute && a.getAttribute("data-keep")){ keep=a.getAttribute("data-keep"); try{ ss=a.selectionStart; se=a.selectionEnd; }catch(e){} }
    const oldCS=root.querySelector('[data-keep="chatscroll"]'); let csTop=null, atBottom=false;
    if(oldCS){ csTop=oldCS.scrollTop; atBottom=(oldCS.scrollHeight-oldCS.clientHeight-oldCS.scrollTop)<8; }

    root.textContent="";
    root.appendChild(frag);

    if(keep){ const n=root.querySelector('[data-keep="'+keep+'"]'); if(n){ n.focus(); if(ss!=null){ try{ n.setSelectionRange(ss,se); }catch(e){} } } }
    const newCS=root.querySelector('[data-keep="chatscroll"]');
    if(newCS && csTop!=null){ newCS.scrollTop = atBottom ? newCS.scrollHeight : csTop; }
  }

  // ---------------------------------------------------------------- data sync (SSE + fallback)
  function loadState(){
    fetch("/api/state").then(r=>{ if(r.status===401){ location.reload(); return null; } return r.json(); })
      .then(d=>{ if(!d) return;
        const sig=JSON.stringify([d.items,d.devices,d.activity,d.chat,d.stats]);
        if(sig===lastSig) return;
        lastSig=sig;
        setState({ items:d.items||[], devices:d.devices||[], activity:d.activity||[], chat:d.chat||[],
                   me:d.me||"", remote:!!d.remote, stats:d.stats||null });
        if(state.tab==="chat") setTimeout(scrollChat,40);
      }).catch(()=>{});
  }
  function startSync(){
    if(window.EventSource){
      try{
        sse=new EventSource("/api/events");
        sse.onmessage=()=>loadState();
        sse.onerror=()=>{ /* browser auto-reconnects; keep a slow poll as belt & braces */ };
        pollTimer=setInterval(loadState, 15000);
        return;
      }catch(e){}
    }
    pollTimer=setInterval(loadState, 2000);
  }

  // ---------------------------------------------------------------- init
  (function init(){
    const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    let saved=null; try{ saved=localStorage.getItem("dz-theme"); }catch(e){}
    document.documentElement.dataset.theme = saved || (dark?"dark":"light");
    state.theme = document.documentElement.dataset.theme;
    document.addEventListener("paste", onPaste);
    doRender();
    loadState();
    startSync();
  })();
})();

</script>
